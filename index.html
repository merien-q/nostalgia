<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD Nostalgia</title>
<style>
  :root{
    --bg:#121212;
    --panel:#181818;
    --panel2:#202020;
    --green:#1DB954;
    --text:#f5f5f5;
    --muted:#9b9b9b;
    --border:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app{
    max-width:860px; margin:0 auto; padding:24px 16px 50px;
    min-height:100vh; display:flex; flex-direction:column;
  }

  .top-bar{
    display:none;
    position:sticky; top:0; background:var(--bg);
    padding:4px 0 14px; z-index:10;
  }
  .top-bar.visible{ display:block; }

  .app-toggle-row{
    display:flex; align-items:center; justify-content:flex-end;
    gap:8px; margin-bottom:12px; font-size:12px; color:var(--muted);
  }
  .app-toggle-row label{
    display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
  }
  .app-toggle-row input{ cursor:pointer; accent-color: var(--green); width:14px; height:14px; }

  .search-row{ display:flex; gap:10px; align-items:flex-start; width:100%; }
  .search-wrap{ position:relative; flex:1; }
  #searchInput{
    width:100%; padding:14px 16px; font-size:16px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel2); color:var(--text); outline:none;
  }
  #searchInput:focus{ border-color:var(--green); }

  .action-btn{
    padding:14px 18px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:14px; cursor:pointer;
    white-space:nowrap; transition:border-color .15s, color .15s, background .15s;
  }
  .action-btn:hover{ border-color:var(--green); color:var(--green); }
  .random-btn{
    background:var(--green); color:#121212; border:none; font-weight:600;
  }
  .random-btn:hover{ background:#1ed760; color:#121212; }

  .dropdown-list{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    max-height:360px; overflow-y:auto; display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:20;
  }
  .dropdown-list.open{ display:block; }
  .dropdown-item{ padding:12px 16px; cursor:pointer; border-bottom:1px solid var(--border); font-size:14px; }
  .dropdown-item:last-child{ border-bottom:none; }
  .dropdown-item:hover, .dropdown-item.active{ background:#2a2a2a; }
  .dropdown-item b{ color:var(--green); }
  .dropdown-empty{ padding:14px 16px; color:var(--muted); font-size:14px; }
  .dropdown-count{
    padding:8px 16px; font-size:11px; color:var(--muted);
    border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel2);
  }

  .home-stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 10px;
  }
  .main-title{
    margin:0;
    font-size:clamp(34px, 8vw, 56px);
    font-weight:800;
    letter-spacing:-1px;
    line-height:1;
  }
  .main-title .cd-emoji{
    font-size:1em;
    line-height:1;
    vertical-align:-0.08em;
    display:inline-block;
  }
  .subtitle{
    color:var(--muted);
    font-size:clamp(15px, 3vw, 18px);
    margin:14px 0 0;
    font-weight:400;
  }
  .home-stage .search-row{
    margin-top:40px;
    max-width:560px;
  }

  #albumDisplay{display:none;margin-top:18px;flex:1;min-width:0;overflow-x:clip;}
  #albumDisplay.visible{display:flex;align-items:center;justify-content:center;}
  .album-layout{width:100%;display:grid;grid-template-columns:minmax(0,1fr);align-items:start;gap:0;}
  .cover-shell{width:min(100%,390px);justify-self:center;min-width:0;text-align:center;}
  .cover-stage{position:relative;width:100%;touch-action:pan-y;}
  .cover-toggle{display:block;position:relative;width:100%;padding:0;border:0;background:transparent;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y;}
  .cover-toggle:focus-visible,.album-nav:focus-visible{outline:2px solid var(--green);outline-offset:6px;}
  .cover-wrap{width:100%;aspect-ratio:1;position:relative;overflow:hidden;border-radius:12px;background:#242424;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 48px rgba(0,0,0,.4);}
  .album-caption{padding:22px 4px 0;overflow-wrap:anywhere;}
  .album-caption .artist-name{font-size:16px;margin:0 0 7px;}
  .album-caption .album-title{font-size:clamp(22px,3vw,29px);line-height:1.2;font-weight:650;letter-spacing:-.6px;}
  .album-caption .album-title a{color:inherit;text-decoration:none;}
  .caption-actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;min-height:32px;}
  .release-year{min-height:0;}
  .album-play{display:inline-flex;align-items:center;gap:6px;color:var(--green);text-decoration:none;font-size:12px;}
  .album-play svg{width:24px;height:24px;}
  .album-play:hover{color:#8af0a6;}
  .favorite-star{width:36px;height:36px;border:0;background:transparent;padding:0;color:#ffd54f;font:32px/1 system-ui;cursor:pointer;}
  .favorite-star:hover{transform:scale(1.12);}
  .favorite-star:focus-visible,.favorites-filter:focus-visible{outline:2px solid #ffd54f;outline-offset:3px;}
  .favorites-filter{width:42px;height:44px;padding:0;flex:0 0 42px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:#ffd54f;font:28px/1 system-ui;}
  .favorites-filter[aria-pressed="true"]{color:#ffd54f;}
  .album-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;padding:0;border:0;background:transparent;color:#aaa;font-size:34px;line-height:1;cursor:pointer;border-radius:9px;}
  .album-nav:hover{background:#202020;color:#fff;}
  .album-nav.prev{right:calc(100% + 20px);}.album-nav.next{left:calc(100% + 20px);}
  .album-meta{display:none;margin-top:16px;}
  .album-meta .match-info{margin:6px 0;}
  .album-meta .wrong-btn{margin-top:8px;max-width:100%;}
  .album-meta a{color:var(--muted);text-decoration:none;display:block;margin-top:7px;}
  #albumDisplay .info{display:none;min-width:0;width:100%;}
  #albumDisplay.expanded{align-items:flex-start;padding-top:12px;}
  .top-bar.album-open{display:none;}
  #albumDisplay.expanded .album-layout{grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:48px;}
  #albumDisplay.expanded .cover-shell{width:100%;}
  #albumDisplay.expanded .info{display:block;animation:reveal-tracks .45s ease both;}
  #albumDisplay.expanded .album-meta{display:block;}
  #albumDisplay.expanded .album-nav{display:none;}
  .tracks-heading{margin:0 0 18px;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;}
  @keyframes reveal-tracks{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .cover-wrap .spinner{ position:absolute; }
  .cover-wrap img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transform:translateY(12px) scale(.96);
    transition:opacity .9s ease-out, transform 1s cubic-bezier(.2,.7,.2,1);
  }
  .cover-wrap img.loaded{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    .cover-wrap img{ transform:none; transition:opacity .2s linear; }
  }
  .cover-fallback{ font-size:13px; color:var(--muted); text-align:center; padding:12px; }
  .spinner{
    width:30px; height:30px; border:3px solid #3a3a3a;
    border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .release-year{ font-size:12px; color:var(--muted); min-height:14px; }

  .match-info{ font-size:11px; color:var(--muted); text-align:center; line-height:1.4; min-height:14px; }
  .wrong-btn{
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .wrong-btn:hover{ border-color:var(--green); color:var(--green); }

  .player{
    width:100%; margin-top:6px; background:var(--panel2); border:1px solid var(--border);
    border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px;
  }
  .player[hidden]{ display:none; }
  .player-note{ font-size:10px; color:var(--muted); text-align:center; line-height:1.4; }
  .seek-row{
    display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .seek-row input[type=range]{ flex:1; min-width:0; accent-color:var(--green); cursor:pointer; }
  .ctl-btn{
    background:none; border:none; color:var(--text); cursor:pointer; padding:0;
    width:36px; height:36px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    transition:color .15s, background .15s;
  }
  .ctl-btn:hover{ color:var(--green); }
  .ctl-btn svg{ width:18px; height:18px; }
  .ctl-btn.main{ background:var(--green); color:#121212; width:36px; height:36px; flex:0 0 36px; }
  .ctl-btn.main:hover{ background:#1ed760; color:#121212; }
  .tracklist li.playing .track-link, .tracklist li.playing .track-num{ color:var(--green); }
  .seek-row{gap:9px;}
  .seek-row input[type=range]{min-width:0;}


  .title-row{ display:flex; align-items:center; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .album-title{ font-size:27px; font-weight:700; margin:0; line-height:1.2; }
  .album-title a{ color:var(--text); text-decoration:none; }
  .album-title a:hover{ color:var(--green); text-decoration:underline; }
  .artist-name{ color:var(--muted); font-size:16px; margin:0 0 18px; }

  .play-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; min-width:26px; border-radius:50%;
    background:var(--green); color:#121212; text-decoration:none;
    font-size:11px; flex-shrink:0; transition:transform .15s, background .15s;
  }
  .play-btn:hover{ background:#1ed760; transform:scale(1.08); }
  .play-btn svg{ width:11px; height:11px; margin-left:1px; }

  .tracklist{ list-style:none; margin:0; padding:0; border-top:1px solid var(--border); min-height:40px; }
  .tracklist li{
    padding:9px 0; border-bottom:1px solid var(--border);
    font-size:14px; display:flex; align-items:center; gap:12px;
  }
  .track-num{ color:var(--muted); min-width:18px; font-size:13px; }
  .tracklist a.track-link{ color:var(--text); text-decoration:none; flex:1; }
  .tracklist a.track-link:hover{ color:var(--green); text-decoration:underline; }
  .track-duration{ color:var(--muted); font-size:12px; min-width:36px; text-align:right; }
  .track-loading{ color:var(--muted); font-size:13px; padding:12px 0; display:flex; align-items:center; gap:10px; }
  .track-loading .mini-spinner{
    width:16px; height:16px; border:2px solid #3a3a3a;
    border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite;
  }
  .track-error{ color:var(--muted); font-size:13px; padding:12px 0; }
  footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:40px; line-height:1.6; }

  @media (max-width: 640px){
    .app{ padding:16px 14px 40px; }

    .main-title{ font-size: clamp(30px, 11vw, 44px); }
    .subtitle{ font-size:16px; }
    .home-stage .search-row{ margin-top:30px; }

    .search-row{ flex-wrap:wrap; }
    .search-wrap{ flex:1 1 100%; }
    .action-btn{ flex:1 1 auto; font-size:15px; padding:13px 16px; }

    .dropdown-item{ font-size:15px; padding:14px 16px; }
    .dropdown-empty{ font-size:14px; }

    .album-title{ font-size:23px; }
    .artist-name{ font-size:15px; }

    .tracklist li{ font-size:15px; padding:11px 0; gap:10px; }
    .track-duration{ font-size:13px; min-width:32px; }
    .play-btn{ width:30px; height:30px; }
    .play-btn svg{ width:13px; height:13px; }

    footer{ font-size:12px; padding:0 6px; }
  }

  .tracklist li[data-idx]{flex-wrap:wrap;}
  .tracklist .player{flex:0 0 100%;margin:6px 0 4px;}
  button.track-link{border:0;background:none;color:var(--text);padding:0;text-align:left;flex:1;font:inherit;cursor:pointer;}
  button.track-link:hover{color:var(--green);}
  span.track-link{flex:1;}
  .tracklist .source-link{display:none;font-size:11px;color:var(--muted);}
  .tracklist li.playing .source-link{display:inline-block;order:10;}
  .tracklist .track-link{min-width:0;overflow-wrap:anywhere;line-height:1.4;}
  .tracklist li[data-idx]{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;align-items:center;column-gap:10px;row-gap:8px;}
  .tracklist .player{grid-column:1/-1;min-width:0;}
  .tracklist li.playing .source-link{grid-column:2/-1;}
  .track-num,.track-duration{min-width:0;}
  .player .np{white-space:normal;overflow-wrap:anywhere;}
  #albumDisplay.visible ~ footer{display:none;}
  footer{margin-top:26px;opacity:.65;font-size:11px;}
  .app{min-height:100svh;max-width:960px;}
  .search-wrap{min-width:0;}
  @media(max-width:720px){
    .app{padding:16px 20px 24px;}
    .top-bar{padding:0 0 12px;}
    .app-toggle-row{font-size:11px;margin-bottom:10px;}
    .search-row{flex-wrap:nowrap;gap:8px;}
    .search-wrap{flex:1 1 0;}
    #searchInput{padding:12px;font-size:16px;}
    .action-btn{flex:0 0 auto;padding:12px;font-size:13px;}
    .home-stage{padding:12px 0;}
    .home-stage .search-row{margin-top:32px;}
    #albumDisplay{margin-top:16px;padding:0;}
    .cover-shell{width:min(100%,350px);}
    .cover-wrap{border-radius:10px;}
    .album-nav{display:none;}
    .album-caption{padding-top:20px;}
    .album-caption .artist-name{font-size:15px;}
    .album-caption .album-title{font-size:25px;}
    .caption-actions{margin-top:10px;}
    .favorites-filter{width:42px;flex-basis:42px;}
    #albumDisplay.expanded{padding-top:0;}
    #albumDisplay.expanded .album-layout{grid-template-columns:minmax(0,1fr);gap:28px;}
    #albumDisplay.expanded .cover-shell{width:min(100%,350px);}
    #albumDisplay.expanded .album-meta{display:none;}
    #albumDisplay.expanded .info{max-width:480px;justify-self:center;}
    .tracklist li[data-idx]{font-size:14px;padding:12px 0;}
    .track-duration{font-size:12px;}
    .tracks-heading{margin-bottom:12px;}
    .player{padding:12px;}
    footer{padding:0;margin-top:22px;}
  }
  @media(prefers-reduced-motion:reduce){
    #albumDisplay.expanded .info{animation:none;}
    .cover-wrap img{transition:opacity .2s linear;transform:none;}
  }
  #collectionStatus{font-size:12px;color:var(--muted);margin-top:12px;}
  button:disabled{opacity:.45;cursor:wait;}
  #favoriteLoginDialog{width:min(92vw,420px);border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);padding:24px;box-shadow:0 18px 60px #000a;}
  #favoriteLoginDialog::backdrop{background:#0009;backdrop-filter:blur(3px);}
  .favorite-login-title{margin:0 0 8px;font-size:20px;}
  .favorite-login-copy{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5;}
  .favorite-login-form label{display:block;margin:12px 0;color:var(--muted);font-size:13px;}
  .favorite-login-form input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);color:var(--text);font-size:16px;}
  .favorite-login-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .favorite-login-error{color:#ff8c8c;font-size:13px;min-height:18px;margin:8px 0 0;}
</style>
</head>
<body>
<div class="app">

  <div id="topBar" class="top-bar">
    <div class="app-toggle-row">
      <label>
        <input type="checkbox" id="appModeToggle">
        Open in Spotify-app (i.p.v. browser)
      </label>
    </div>
    <div id="topSearchRow"></div>
  </div>

  <div id="homeStage" class="home-stage">
    <h1 class="main-title">CD <span class="cd-emoji">💿</span> Nostalgia</h1>
    <p class="subtitle">Merien's collectie</p>
    <div id="homeSearchRow"></div><div id="collectionStatus" role="status" aria-live="polite"></div>
  </div>

  <main id="albumDisplay"></main>

  <footer>
    Korte previews, met links naar Spotify waar beschikbaar.
  </footer>
</div>

<div class="search-row" id="searchRow">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Zoek artiest of album..." autocomplete="off">
    <div id="dropdownList" class="dropdown-list"></div>
  </div>
  <button id="favoritesFilter" class="favorites-filter" type="button" aria-label="Toon alle albums" aria-pressed="false" title="Toon alle albums">☆</button>
  <button id="randomBtn" class="action-btn random-btn" type="button">Random</button>
</div>

<dialog id="favoriteLoginDialog" aria-labelledby="favoriteLoginTitle">
  <h2 class="favorite-login-title" id="favoriteLoginTitle">Favoriet opslaan</h2>
  <p class="favorite-login-copy">Log in met je Supabase beheeraccount. De favoriet wordt dan voor iedereen bij dit album opgeslagen.</p>
  <form id="favoriteLoginForm" class="favorite-login-form">
    <label>E-mailadres<input id="favoriteEmail" type="email" autocomplete="username" required></label>
    <label>Wachtwoord<input id="favoritePassword" type="password" autocomplete="current-password" required></label>
    <p id="favoriteLoginError" class="favorite-login-error" role="alert"></p>
    <div class="favorite-login-actions">
      <button class="action-btn" id="favoriteLoginCancel" type="button">Annuleren</button>
      <button class="action-btn random-btn" id="favoriteLoginSubmit" type="submit">Inloggen</button>
    </div>
  </form>
</dialog>

<script>
// De database is de enige bron voor de albumcollectie.
let albumsData = [];
const DB_URL = 'https://oqqukeaoscwfsijlwrpn.supabase.co';
const DB_KEY = 'sb_publishable__Cl45YCzMcAbKi1WHrng9A_s9DH6bz_';
const OWNER_ID = '1ecdd7a5-3576-4e28-8d07-27add4ad3272';
function safeHttps(value){
  try { const u = new URL(value); return u.protocol === 'https:' ? u.href : ''; }
  catch { return ''; }
}
function artworkUrl(value, size=1200){
  const safe=safeHttps(value); if(!safe) return '';
  const u=new URL(safe);
  if(u.hostname.endsWith('.mzstatic.com')){
    u.pathname=u.pathname.replace(/\/(\d+)x(\d+)([^/]*)$/, (all,w,h,tail)=>
      Number(w)<size || Number(h)<size ? `/${size}x${size}${tail}` : all);
  }
  return u.href;
}
function spotifyItem(type, id){
  if(!/^[A-Za-z0-9]{22}$/.test(id || '')) return '';
  return getLinkMode() === 'app' ? `spotify:${type}:${id}` : `https://open.spotify.com/${type}/${id}`;
}
async function readDatabase(path){
  const r = await fetch(DB_URL + '/rest/v1/' + path, {
    headers: { apikey: DB_KEY }, signal: AbortSignal.timeout(20000), cache: 'no-store'
  });
  if(!r.ok) throw new Error('Database niet bereikbaar (' + r.status + ').');
  return r.json();
}
async function authRequest(path, body){
  const r=await fetch(DB_URL+path,{method:'POST',headers:{apikey:DB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.msg||data.message||data.error_description||'Inloggen is niet gelukt. Controleer je e-mailadres en wachtwoord.');
  return data;
}
async function loadCollection(){
  searchInput.disabled = randomBtn.disabled = true;
  searchInput.placeholder = 'Collectie laden…';
  const status = document.getElementById('collectionStatus');
  status.replaceChildren();
  try {
    const rows = [];
    for(let offset=0;;offset+=500){
      const batch = await readDatabase('albums?select=*&order=artist.asc,title.asc,id.asc&limit=500&offset='+offset);
      rows.push(...batch); if(batch.length < 500) break;
    }
    albumsData = rows.map(r => ({ ...r, album:r.title }));
    favoriteIds = new Set(rows.filter(a => a.is_favorite === true).map(a => a.id));
    updateFavoritesFilter();
    searchInput.placeholder = 'Zoek artiest of album…';
    searchInput.disabled = false;
    randomBtn.disabled = !rows.length;
    document.getElementById('favoritesFilter').disabled = !rows.length;
    status.textContent = rows.length ? rows.length + ' albums' : 'De collectie is nog leeg.';
  } catch(e){
    status.textContent = 'De collectie kon niet worden geladen. ';
    searchInput.placeholder = 'Collectie niet beschikbaar';
    const retry = document.createElement('button');
    retry.className = 'wrong-btn'; retry.textContent = 'Opnieuw proberen';
    retry.onclick = loadCollection; status.appendChild(retry);
  }
}

/* ============================================================
   LOGICA — hoeft niet aangepast te worden bij het toevoegen
   van albums
   ============================================================ */

const searchRowEl = document.getElementById('searchRow');
const homeSearchRow = document.getElementById('homeSearchRow');
const topSearchRow = document.getElementById('topSearchRow');
const topBar = document.getElementById('topBar');
const homeStage = document.getElementById('homeStage');

const searchInput = document.getElementById('searchInput');
const dropdownList = document.getElementById('dropdownList');
const albumDisplay = document.getElementById('albumDisplay');
const randomBtn = document.getElementById('randomBtn');

async function getFavoriteAccessToken(){
  if(!favoriteSession)return null;
  if(Date.now()<((favoriteSession.expires_at||0)*1000)-60000)return favoriteSession.access_token;
  try{
    const refreshed=await authRequest('/auth/v1/token?grant_type=refresh_token',{refresh_token:favoriteSession.refresh_token});
    if(refreshed.user?.id!==OWNER_ID)throw new Error('Dit account heeft geen beheerrechten.');
    saveFavoriteSession({...refreshed,expires_at:refreshed.expires_at||Math.floor(Date.now()/1000)+refreshed.expires_in});
    return favoriteSession.access_token;
  }catch{clearFavoriteSession();return null;}
}

  return localStorage.getItem('cdNostalgiaLinkMode') || 'web';
}

  localStorage.setItem('cdNostalgiaLinkMode', mode);

  const mode = getLinkMode();
  if(mode === 'app'){
    return `spotify:search:${encodeURIComponent(query)}`;
  }
  return `https://open.spotify.com/search/${encodeURIComponent(query)}`;
}

function formatDuration(ms){
  if(!ms || ms <= 0) return '';
  const totalSeconds = Math.round(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}:${seconds.toString().padStart(2,'0')}`;
}

/* ------------------------------------------------------------
   JSONP helper (CORS-vrij, werkt ook via file://)
   ------------------------------------------------------------ */
function jsonp(url){
  return new Promise((resolve, reject) => {
    const callbackName = `jsonpCb_${Date.now()}_${jsonpCounter++}`;
    const script = document.createElement('script');

    let timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('JSONP timeout'));
    }, 8000);

    function cleanup(){
      clearTimeout(timeoutId);
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('JSONP script load error')); };
    script.src = `${url}&callback=${callbackName}`;
    document.body.appendChild(script);
  });
}

/* ------------------------------------------------------------
   Handmatige correcties
   ------------------------------------------------------------
   Gaat een album toch nog fout? Zet het hier vast. De sleutel is
   exact zoals het in de lijst staat ("Artiest - Album").
   Waarde: { itunes: <collectionId> } of { deezer: <albumId> }.
   - iTunes-id: het getal na "/id" in een music.apple.com-albumlink
   - Deezer-id: het getal in een deezer.com/album/<id> link
   ------------------------------------------------------------ */
const manualOverrides = {
  // "Air - LateNightTales": { itunes: 123456789 },
  // "Various artists- Planet V": { deezer: 123456789 },
};

/* ------------------------------------------------------------
   Matching-logica
   ------------------------------------------------------------
   1. Meerdere zoekopdrachten tegelijk (iTunes, daarna zo nodig Deezer)
   2. Elke kandidaat zelf scoren op titel én artiest
   3. Edities ("Remastered", "Deluxe") negeren, tribute/karaoke afstraffen
   4. Kandidaten die niet écht kloppen worden weggegooid
   5. Bij gelijke score wint de oudste (originele) uitgave
   6. "Verkeerd album?"-knop laat je door de beste alternatieven bladeren
   ------------------------------------------------------------ */

/* ==MATCH-START== */
const EDITION_RE = /re-?master|deluxe|expanded|anniversar|bonus|explicit|reissue|special|collector|legacy|edition|digital|\bmono\b|\bstereo\b/i;
const JUNK_RE = /\b(tribute|karaoke|lullaby|instrumental|made famous|originally performed|in the style of|cover version|workout|piano version|string quartet|8 bit)\b/;

function isVarious(artist){ return /^various/i.test(artist || ''); }

// lowercase, geen accenten, geen leestekens, "&" = "and"
function normalize(str){
  return (str || '')
    .toLowerCase()
    .replace(/&/g, ' and ')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

// Haalt editie-toevoegsels weg: "(Remastered)", "[Deluxe Edition]", " - 2011 Remaster"
function cleanTitle(t){
  let s = t || '';
  s = s.replace(/[\(\[][^\)\]]*[\)\]]/g, m => EDITION_RE.test(m) ? ' ' : m);
  s = s.replace(/\s[-–—]\s.*(remaster|deluxe|edition|expanded|anniversary|bonus|reissue).*$/i, ' ');
  return s;
}

function artistTokens(a){
  return normalize(a).split(' ').filter(t => t && t !== 'the');
}

function artistScore(candArtist, targetArtist){
  const A = artistTokens(candArtist), B = artistTokens(targetArtist);
  if(!A.length || !B.length) return 0;
  const setB = new Set(B);
  let inter = 0;
  for(const t of new Set(A)){ if(setB.has(t)) inter++; }
  const union = new Set([...A, ...B]).size;
  const jaccard = union ? inter / union : 0;
  const overlap = inter / Math.min(new Set(A).size, setB.size);
  return Math.max(jaccard, overlap * 0.9);
}

// Titelmatch. Behandelt ook "LateNightTales: Air" tegenover "LateNightTales"
// (artiestnaam in de titel) en "FabricLive.49" tegenover "Fabric Live 49".
function titleScore(candTitle, target, artist){
  const ct = normalize(cleanTitle(candTitle));
  const tt = normalize(cleanTitle(target));
  if(!ct || !tt) return 0;
  const compactT = tt.replace(/ /g, '');
  if(ct === tt || ct.replace(/ /g, '') === compactT) return 1;

  const calc = (str) => {
    const A = new Set(str.split(' ')), B = new Set(tt.split(' '));
    let inter = 0;
    for(const x of A){ if(B.has(x)) inter++; }
    const union = A.size + B.size - inter;
    let s = union ? inter / union : 0;
    const small = Math.min(A.size, B.size);
    if(small >= 2 && inter === small) s = Math.max(s, 0.8); // titel zit volledig in de ander
    return s;
  };

  let best = calc(ct);
  const at = new Set(artistTokens(artist));
  const rest = ct.split(' ').filter(x => !at.has(x)).join(' ');
  if(rest && rest !== ct){
    if(rest.replace(/ /g, '') === compactT) best = Math.max(best, 0.95);
    else best = Math.max(best, calc(rest) * 0.95);
  }
  return best;
}

function candKey(c){ return `${c.source}:${c.id}`; }

// Scoort, filtert en sorteert kandidaten. Geeft maximaal 8 terug.
function rankCandidates(cands, artist, album){
  const various = isVarious(artist);
  const targetNorm = normalize(album);
  const aTokens = new Set(artistTokens(artist));
  const out = [];
  const seen = new Set();

  for(const c of cands){
    if(!c || !c.id) continue;
    const key = candKey(c);
    if(seen.has(key)) continue;
    seen.add(key);

    const tScore = titleScore(c.title, album, artist);
    if(tScore < (various ? 0.75 : 0.6)) continue;

    let aScore;
    if(various){
      aScore = /various/i.test(c.artist || '') ? 1 : 0.5;
    } else {
      aScore = artistScore(c.artist, artist);
      // Compilatie als "Various Artists" waarvan de titel de artiest noemt
      if(aScore < 0.5 && /various/i.test(c.artist || '')){
        const titleTokens = new Set(normalize(c.title).split(' '));
        const artistInTitle = aTokens.size > 0 && [...aTokens].every(t => titleTokens.has(t));
        if(artistInTitle) aScore = 0.6;
      }
      if(aScore < 0.5) continue;
    }

    let score = various ? tScore * 0.85 + aScore * 0.15 : tScore * 0.7 + aScore * 0.3;

    const candText = normalize(c.title) + ' ' + normalize(c.artist);
    if(JUNK_RE.test(candText) && !JUNK_RE.test(targetNorm)) score -= 0.4;

    c.score = score;
    out.push(c);
  }

  out.sort((x, y) => {
    if(Math.abs(x.score - y.score) > 0.03) return y.score - x.score;
    const yx = parseInt(x.year, 10) || 9999;
    const yy = parseInt(y.year, 10) || 9999;
    if(yx !== yy) return yx - yy;                       // oudste uitgave eerst
    return (x.trackCount || 0) - (y.trackCount || 0) || y.score - x.score;
  });

  return out.slice(0, 8);
}
/* ==MATCH-END== */

/* ------------------------------------------------------------
   Bronnen: iTunes + Deezer (beide via JSONP)
   ------------------------------------------------------------ */
const enc = encodeURIComponent;

async function safeJsonp(url){
  try{ return await jsonp(url); }
  catch(err){ console.warn('Request mislukt:', url, '-', err.message); return null; }
}

function itunesToCand(r){
  return {
    source: 'itunes',
    id: r.collectionId,
    artist: r.artistName || '',
    title: r.collectionName || '',
    coverUrl: artworkUrl(r.artworkUrl100) || null,
    year: r.releaseDate ? r.releaseDate.slice(0, 4) : null,
    storeUrl: r.collectionViewUrl || '',
    trackCount: r.trackCount || 0
  };
}

function deezerToCand(r){
  return {
    source: 'deezer',
    id: r.id,
    artist: (r.artist && r.artist.name) || '',
    title: r.title || '',
    coverUrl: r.cover_xl || r.cover_big || r.cover_medium || null,
    year: r.release_date ? r.release_date.slice(0, 4) : null,
    storeUrl: r.link || '',
    trackCount: r.nb_tracks || 0
  };
}

async function searchItunes(artist, album){
  const various = isVarious(artist);
  const combined = various ? album : `${artist} ${album}`;
  const base = 'https://itunes.apple.com/search?media=music&entity=album';
  // Per resultaat onthouden we uit welke winkel (land) het komt: een album dat
  // alleen in de NL-winkel staat, heeft géén tracks in de US-winkel.
  const jobs = [
    { country: 'US', url: `${base}&term=${enc(combined)}&limit=25&country=US` },
    { country: 'NL', url: `${base}&term=${enc(combined)}&limit=25&country=NL` },
    { country: 'US', url: `${base}&attribute=albumTerm&term=${enc(album)}&limit=50&country=US` }
  ];
  // Alle albums van de artiest (grote limiet, zodat niets wegvalt)
  if(!various) jobs.push({ country: 'US', url: `${base}&attribute=artistTerm&term=${enc(artist)}&limit=200&country=US` });

  const responses = await Promise.all(jobs.map(j => safeJsonp(j.url)));
  const byId = new Map();
  responses.forEach((d, k) => {
    if(!d || !d.results) return;
    for(const r of d.results){
      if(!(r.collectionId && r.collectionName)) continue;
      let c = byId.get(r.collectionId);
      if(!c){ c = itunesToCand(r); c.countries = []; byId.set(r.collectionId, c); }
      if(!c.countries.includes(jobs[k].country)) c.countries.push(jobs[k].country);
    }
  });
  return [...byId.values()];
}

async function searchDeezer(artist, album){
  const clean = s => s.replace(/"/g, '');
  const various = isVarious(artist);
  const queries = various
    ? [clean(album), `album:"${clean(album)}"`]
    : [`artist:"${clean(artist)}" album:"${clean(album)}"`, `${clean(artist)} ${clean(album)}`, `album:"${clean(album)}"`];
  const responses = await Promise.all(queries.map(q =>
    safeJsonp(`https://api.deezer.com/search/album?q=${enc(q)}&limit=25&output=jsonp`)
  ));
  const out = [];
  for(const d of responses){
    if(!d || !d.data) continue;
    for(const r of d.data){ if(r.id && r.title) out.push(deezerToCand(r)); }
  }
  return out;
}

async function loadOverride(ov){
  if(ov.itunes){
    const d = await safeJsonp(`https://itunes.apple.com/lookup?id=${enc(ov.itunes)}`);
    const r = d && d.results && d.results.find(x => x.collectionId);
    if(r) return itunesToCand(r);
  }
  if(ov.deezer){
    const d = await safeJsonp(`https://api.deezer.com/album/${enc(ov.deezer)}?output=jsonp`);
    if(d && d.id) return deezerToCand(d);
  }
  return null;
}

// Deezer geeft het jaar pas in de albumdetails
async function ensureDetails(c){
  if(c.source === 'deezer' && !c.year && !c.detailsDone){
    c.detailsDone = true;
    const d = await safeJsonp(`https://api.deezer.com/album/${enc(c.id)}?output=jsonp`);
    if(d && d.release_date) c.year = d.release_date.slice(0, 4);
  }
}

// Zoekt de beste kandidaten voor een album (met cache)
async function findCandidates(a){
  const label = labelFor(a);
  if(albumCache.has(label)) return albumCache.get(label);

  const result = [];
  const ov = manualOverrides[label];
  if(ov){
    const c = await loadOverride(ov);
    if(c){ c.score = 2; result.push(c); }
  }

  let ranked = [];
  try{
    ranked = rankCandidates(await searchItunes(a.artist, a.album), a.artist, a.album);
    // Geen (bijna) perfecte treffer? Probeer ook Deezer en kies uit alles samen.
    if(!ranked.length || ranked[0].score < 0.85){
      const dz = await searchDeezer(a.artist, a.album);
      ranked = rankCandidates([...ranked, ...dz], a.artist, a.album);
    }
  } catch(err){
    console.warn('Zoeken mislukt voor', label, '-', err.message);
  }

  const have = new Set(result.map(candKey));
  for(const c of ranked){ if(!have.has(candKey(c))) result.push(c); }

  albumCache.set(label, result);
  return result;
}

// Tracklijst (naam + duur + 30s-preview), per bron.
// Probeert meerdere iTunes-winkels, valt daarna terug op Deezer.
const TRACK_COUNTRIES = ['US', 'NL', 'GB', 'DE'];

async function fetchItunesTracks(id, countries){
  const list = [...new Set([...(countries || []), ...TRACK_COUNTRIES])];
  for(const country of list){
    let d = await safeJsonp(`https://itunes.apple.com/lookup?id=${enc(id)}&entity=song&limit=200&country=${country}`);
    if(!d) d = await safeJsonp(`https://itunes.apple.com/lookup?id=${enc(id)}&entity=song&limit=200&country=${country}`); // 1x opnieuw bij time-out
    const tracks = ((d && d.results) || [])
      .filter(r => r.wrapperType === 'track' && r.trackName)
      .sort((x, y) => (x.discNumber || 1) - (y.discNumber || 1) || (x.trackNumber || 0) - (y.trackNumber || 0))
      .map(r => ({ name: r.trackName, artist:r.artistName, durationMs: r.trackTimeMillis || null, previewUrl: safeHttps(r.previewUrl), storeUrl:r.trackViewUrl || '', source:'itunes' }));
    if(tracks.length) return tracks;
  }
  return [];
}

async function fetchDeezerTracks(id){
  let d = await safeJsonp(`https://api.deezer.com/album/${enc(id)}/tracks?limit=200&output=jsonp`);
  if(!d) d = await safeJsonp(`https://api.deezer.com/album/${enc(id)}/tracks?limit=200&output=jsonp`);
  return ((d && d.data) || [])
    .sort((x, y) => (x.disk_number || 1) - (y.disk_number || 1) || (x.track_position || 0) - (y.track_position || 0))
    .map(r => ({ name: r.title, artist:r.artist?.name, durationMs: r.duration ? r.duration * 1000 : null, previewUrl: safeHttps(r.preview), storeUrl:r.link || '', source:'deezer' }));
}

async function fetchTracklist(c, a){
  const key = candKey(c);
  if(trackCache.has(key)) return trackCache.get(key);

  let tracks = c.source === 'itunes' ? await fetchItunesTracks(c.id, c.countries) : await fetchDeezerTracks(c.id);

  // iTunes heeft het album wel, maar geen tracks? Zoek hetzelfde album op Deezer.
  if(!tracks.length && c.source === 'itunes' && a){
    const dz = rankCandidates(await searchDeezer(a.artist, a.album), a.artist, a.album)[0];
    if(dz) tracks = await fetchDeezerTracks(dz.id);
  }

  if(tracks.length) trackCache.set(key, tracks);
  return tracks;
}

/* ------------------------------------------------------------
   Speler: 30-seconden previews via <audio> (geen login of setup nodig)
   - klik op een tracktitel om af te spelen
   - volgende track start automatisch, de komende track wordt vooraf geladen
   - mediatoetsen / vergrendelscherm werken via de Media Session API
   ------------------------------------------------------------ */
const ICON = {
  play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',

};

const audio = new Audio();
audio.preload = 'auto';
const preloader = new Audio();   // laadt alvast de volgende track
preloader.preload = 'auto';

let play = null;          // { a, tracks, key, idx, cover } wat er nu speelt
let playDisplay = null;   // { a, tracks, key, cover } het getoonde album
let seeking = false;

const playerEl = document.createElement('div');
playerEl.className = 'player';
playerEl.hidden = true;
playerEl.innerHTML = `
  <div class="seek-row">
    <span data-role="pos">0:00</span>
    <input type="range" min="0" max="1000" value="0" step="1" data-role="seek" aria-label="Voortgang">
    <span data-role="dur">0:30</span>
    <button class="ctl-btn main" type="button" data-role="toggle" aria-label="Afspelen">${ICON.play}</button>
  </div>
  <div class="player-note">Korte preview</div>
`;
const pEl = role => playerEl.querySelector(`[data-role="${role}"]`);

function hasPreview(t){ return !!(t && t.previewUrl); }

function fmtTime(sec){
  const s = Math.max(0, Math.round(sec || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function renderPlayerUI(){
  playerEl.hidden = !(play && playDisplay && play.key === playDisplay.key);
}
function mountPlayer(){
  const list = document.getElementById('trackList');
  const li = play && playDisplay && play.key === playDisplay.key && list
    ? list.querySelector(`li[data-idx="${play.idx}"]`) : null;
  if(li) li.appendChild(playerEl);
  else playerEl.remove();
  renderPlayerUI();
}
function stopPlayback(){
  audio.pause(); audio.removeAttribute('src'); audio.load();
  preloader.removeAttribute('src'); preloader.load();
  play = null; playDisplay = null; playerEl.remove();
  if('mediaSession' in navigator) navigator.mediaSession.metadata = null;
}

function updateIcon(){
  pEl('toggle').innerHTML = audio.paused ? ICON.play : ICON.pause;
  pEl('toggle').setAttribute('aria-label',audio.paused?'Afspelen':'Pauzeren');
}

function updateProgress(){
  const dur = isFinite(audio.duration) ? audio.duration : 0;
  const cur = audio.currentTime || 0;
  if(!seeking) pEl('seek').value = dur ? Math.round(cur / dur * 1000) : 0;
  pEl('pos').textContent = fmtTime(cur);
  pEl('dur').textContent = fmtTime(dur || 30);
}

// Kleurt het spelende nummer groen, ook als je terugkeert naar dit album
function updateHighlight(){
  const list = document.getElementById('trackList');
  if(!list) return;
  list.querySelectorAll('li.playing').forEach(li => li.classList.remove('playing'));
  if(!play || !playDisplay || play.key !== playDisplay.key) return;
  const li = list.querySelector(`li[data-idx="${play.idx}"]`);
  if(li) li.classList.add('playing');
  mountPlayer();
}

function nextIndex(from, dir){
  if(!play) return -1;
  for(let i = from + dir; i >= 0 && i < play.tracks.length; i += dir){
    if(hasPreview(play.tracks[i])) return i;
  }
  return -1;
}

function preloadNext(){
  const n = nextIndex(play.idx, 1);
  if(n >= 0){
    preloader.src = play.tracks[n].previewUrl;
    preloader.load();
  }
}

function updateMediaSession(){
  if(!('mediaSession' in navigator) || !play || typeof MediaMetadata === 'undefined') return;
  try{
    const t = play.tracks[play.idx];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name,
      artist: play.a.artist,
      album: play.a.album,
      artwork: play.cover ? [{ src: play.cover, sizes: '600x600' }] : []
    });
  } catch(e){}
}

function startTrack(ctx, idx){
  const t = ctx.tracks[idx];
  if(!hasPreview(t)) return false;
  play = { a: ctx.a, tracks: ctx.tracks, key: ctx.key, cover: ctx.cover, idx };
  audio.src = t.previewUrl;
  const p = audio.play();
  if(p && p.catch) p.catch(() => { playerEl.querySelector('.player-note').textContent = 'Afspelen mislukt. Tik nogmaals op de afspeelknop.'; });
  playerEl.querySelector('.player-note').textContent = t.source === 'itunes' ? 'Korte preview · provided courtesy of iTunes' : 'Korte preview · Deezer';
  renderPlayerUI();
  updateHighlight();
  updateProgress();
  preloadNext();
  updateMediaSession();
  return true;
}

function togglePlay(){
  if(play){
    if(audio.paused){ const p = audio.play(); if(p && p.catch) p.catch(() => { playerEl.querySelector('.player-note').textContent = 'Afspelen mislukt. Tik nogmaals op de afspeelknop.'; }); }
    else audio.pause();
    return;
  }
  if(playDisplay){
    const first = playDisplay.tracks.findIndex(hasPreview);
    if(first >= 0) startTrack(playDisplay, first);
  }
}

audio.addEventListener('play', updateIcon);
audio.addEventListener('pause', updateIcon);
audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', updateProgress);
audio.addEventListener('ended', () => {
  const n = nextIndex(play ? play.idx : 0, 1);
  if(n >= 0) startTrack(play, n);   // volgende track start vanzelf
  else updateIcon();
});
audio.addEventListener('error', () => {
  if(!play || !audio.getAttribute('src')) return;
  const n = nextIndex(play.idx, 1);
  if(n >= 0) startTrack(play, n);
});

pEl('toggle').addEventListener('click', togglePlay);

const seekEl = pEl('seek');
seekEl.addEventListener('input', () => {
  seeking = true;
  const dur = isFinite(audio.duration) ? audio.duration : 30;
  pEl('pos').textContent = fmtTime(dur * seekEl.value / 1000);
});
seekEl.addEventListener('change', () => {
  const dur = isFinite(audio.duration) ? audio.duration : 0;
  if(dur) audio.currentTime = dur * seekEl.value / 1000;
  seeking = false;
});

if('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
  } catch(e){}
}

// Klik op een tracktitel = afspelen; zonder preview opent de Spotify-link gewoon
albumDisplay.addEventListener('click', e => {
  const link = e.target.closest('button.track-link');
  if(!link || !playDisplay) return;
  if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const idx = parseInt(link.dataset.idx, 10);
  if(!hasPreview(playDisplay.tracks[idx])) return;
  e.preventDefault();
  if(play && play.key === playDisplay.key && play.idx === idx){ togglePlay(); return; }
  startTrack(playDisplay, idx);
});

/* ------------------------------------------------------------
   Weergave
   ------------------------------------------------------------ */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function loadPicks(){
  try{ return JSON.parse(localStorage.getItem('cdNostalgiaPicks') || '{}'); }
  catch(e){ return {}; }
}
function savePick(label, key){
  try{
    const p = loadPicks();
    p[label] = key;
    localStorage.setItem('cdNostalgiaPicks', JSON.stringify(p));
  } catch(e){}
}

async function renderAlbum(a){
  const requestId = ++currentRequestId;
  stopPlayback();
  const albumUrl = a.spotify_id ? spotifyItem('album', a.spotify_id) : spotifySearchUrl(`${a.artist} ${a.album}`);

  cancelCoverAnimation();
  albumDisplay.classList.toggle('expanded',isAlbumExpanded);
  topBar.classList.toggle('album-open',isAlbumExpanded);
  albumDisplay.innerHTML = `
    <div class="album-layout">
      <div class="cover-shell">
        <div class="cover-stage">
          <button type="button" class="album-nav prev" id="prevAlbum" aria-label="Vorig album">‹</button>
          <button type="button" class="cover-toggle" id="coverToggle" aria-expanded="${isAlbumExpanded}" aria-controls="albumInfo" aria-label="${isAlbumExpanded ? 'Nummers verbergen' : 'Nummers tonen'}: ${esc(a.album)}">
            <div class="cover-wrap" id="coverWrap"><div class="spinner"></div></div>
          </button>
          <button type="button" class="album-nav next" id="nextAlbum" aria-label="Volgend album">›</button>
        </div>
        <div class="album-caption">
          <p class="artist-name">${esc(a.artist)}</p>
          <h1 class="album-title">${esc(a.album)}</h1>
          <div class="caption-actions">
            <span class="release-year" id="releaseYear">${esc(a.release_year || '')}</span>
            <a class="album-play" href="${albumUrl}" target="_blank" rel="noopener" aria-label="Open ${esc(a.album)} op Spotify">${playIconSvg}<span>Spotify</span></a>
            <button class="favorite-star" id="favoriteToggle" type="button" aria-label="${favoriteIds.has(a.id) ? 'Verwijder uit favorieten' : 'Voeg toe aan favorieten'}" aria-pressed="${favoriteIds.has(a.id)}" title="${favoriteIds.has(a.id) ? 'Verwijder uit favorieten' : 'Voeg toe aan favorieten'}">${favoriteIds.has(a.id) ? '★' : '☆'}</button>
          </div>
        </div>
        <div class="album-meta">
          <div class="match-info" id="matchInfo"></div>
          <button class="wrong-btn" id="wrongBtn" type="button" hidden></button>
        </div>
      </div>
      <div class="info" id="albumInfo" aria-hidden="${!isAlbumExpanded}" ${isAlbumExpanded ? '' : 'inert'}>
        <h2 class="tracks-heading">Nummers</h2>
        <ol class="tracklist" id="trackList">
          <li class="track-loading"><span class="mini-spinner"></span> Nummers laden…</li>
        </ol>
      </div>
    </div>
  `;
  document.getElementById('coverToggle').onclick=()=>{
    if(performance.now()<suppressCoverClickUntil)return;
    toggleAlbumView();
  };
  document.getElementById('prevAlbum').onclick=()=>navigateAlbum(-1);
  document.getElementById('nextAlbum').onclick=()=>navigateAlbum(1);
  document.getElementById('prevAlbum').disabled=document.getElementById('nextAlbum').disabled=albumsData.length<2;
  document.getElementById('favoriteToggle').onclick=toggleFavorite;
  mountPlayer();
  if(a.cover_url) showCover(document.getElementById('coverWrap'),{coverUrl:a.cover_url},a);

  let stored;
  try {
    stored = await readDatabase('tracks?album_id=eq.'+encodeURIComponent(a.id)+'&select=*&order=disc_number.asc,track_number.asc');
  } catch(e){
    if(requestId !== currentRequestId) return;
    document.getElementById('trackList').innerHTML='<li class="track-error">Nummers konden niet worden geladen. Kies het album opnieuw om het te proberen.</li>';
    showCover(document.getElementById('coverWrap'), {coverUrl:safeHttps(a.cover_url)}, a);
    return;
  }
  if(requestId !== currentRequestId) return;
  if(stored.length){
    showCover(document.getElementById('coverWrap'), {coverUrl:safeHttps(a.cover_url)}, a);
    document.getElementById('releaseYear').textContent=a.release_year || document.getElementById('releaseYear').textContent;
    document.getElementById('matchInfo').textContent='Uit je collectie';
    showStoreLink(a.itunes_url);
    renderTracks(a, stored.map(t=>({name:t.title,artist:t.artist,durationMs:t.duration_ms,previewUrl:safeHttps(t.preview_url),spotify_id:t.spotify_id,storeUrl:t.itunes_url,source:'itunes'})), 'db:'+a.id, safeHttps(a.cover_url));
    return;
  }
  const cands = a.itunes_id ? [{source:'itunes',id:a.itunes_id,artist:a.artist,title:a.album,coverUrl:safeHttps(a.cover_url),year:a.release_year,countries:[a.itunes_country || 'NL'],storeUrl:a.itunes_url}] : await findCandidates(a);
  if(requestId !== currentRequestId) return;

  const picked = loadPicks()[labelFor(a)];
  let idx = cands.findIndex(c => candKey(c) === picked);
  if(idx < 0) idx = 0;
  showCandidate(a, cands, idx, 0);
}

function showCover(coverWrap, c, a){
  if(!c.coverUrl){
    coverWrap.innerHTML = `<div class="cover-fallback">Geen hoes gevonden<br>${esc(a.artist)}<br>${esc(a.album)}</div>`;
    return;
  }
  if(coverWrap.querySelector('img')?.dataset.artwork === artworkUrl(c.coverUrl))return;
  // Spinner blijft staan tot de hoes echt binnen is, dan fade-in
  coverWrap.innerHTML = `<div class="spinner"></div><img alt="${esc(a.album)} cover">`;
  const img = coverWrap.querySelector('img');
  const reveal = () => {
    requestAnimationFrame(() => {
      img.classList.add('loaded');
      const sp = coverWrap.querySelector('.spinner');
      if(sp) sp.remove();
    });
  };
  img.addEventListener('load', reveal);
  let triedFallback=false;
  img.addEventListener('error', () => {
    const fallback=safeHttps(c.coverUrl);
    if(!triedFallback && fallback && img.src!==fallback){triedFallback=true;img.src=fallback;return;}
    coverWrap.innerHTML = `<div class="cover-fallback">Hoes kon niet geladen worden<br>${esc(a.artist)}<br>${esc(a.album)}</div>`;
  });
  img.dataset.artwork=artworkUrl(c.coverUrl);
  img.src = img.dataset.artwork;
  img.draggable=false;
  img.decoding='async';
  if(img.complete && img.naturalWidth) reveal();
}

async function showCandidate(a, cands, idx, tried){
  const requestId = ++currentRequestId;
  const coverWrap = document.getElementById('coverWrap');
  const releaseYearEl = document.getElementById('releaseYear');
  const matchInfo = document.getElementById('matchInfo');
  const wrongBtn = document.getElementById('wrongBtn');
  const trackListEl = document.getElementById('trackList');
  if(!coverWrap || !trackListEl) return;

  stopPlayback();
  updateHighlight();
  renderPlayerUI();

  // Reset naar laadstatus (belangrijk bij doorbladeren)
  coverWrap.innerHTML = '<div class="spinner"></div>';
  releaseYearEl.textContent = '';
  matchInfo.textContent = '';
  trackListEl.innerHTML = `<li class="track-loading"><span class="mini-spinner"></span> Tracklijst laden...</li>`;

  if(!cands.length){
    coverWrap.innerHTML = `<div class="cover-fallback">Geen hoes gevonden<br>${esc(a.artist)}<br>${esc(a.album)}</div>`;
    trackListEl.innerHTML = `<li class="track-error">Album niet gevonden — geen tracklijst beschikbaar.</li>`;
    wrongBtn.hidden = true;
    return;
  }

  const c = cands[idx];
  await ensureDetails(c);
  if(requestId !== currentRequestId) return;

  showCover(coverWrap, {...c, coverUrl:safeHttps(a.cover_url) || safeHttps(c.coverUrl)}, a);
  releaseYearEl.textContent = a.release_year || c.year || '';
  showStoreLink(c.storeUrl);
  matchInfo.textContent = `Automatisch gevonden: ${c.artist} – ${c.title}`;

  wrongBtn.hidden = cands.length < 2;
  wrongBtn.textContent = `Verkeerd album? Probeer volgende (${idx + 1}/${cands.length})`;
  wrongBtn.onclick = () => {
    const next = (idx + 1) % cands.length;
    savePick(labelFor(a), candKey(cands[next]));
    showCandidate(a, cands, next, 0);
  };

  const tracks = await fetchTracklist(c, a);
  if(requestId !== currentRequestId) return;

  if(tracks.length === 0){
    // Geen tracks bij deze kandidaat (ook niet via Deezer): probeer automatisch de volgende
    if(tried < cands.length - 1){
      showCandidate(a, cands, (idx + 1) % cands.length, tried + 1);
      return;
    }
    trackListEl.innerHTML = `<li class="track-error">Geen tracklijst gevonden voor dit album.</li>`;
    return;
  }

  renderTracks(a, tracks, labelFor(a) + '|' + candKey(c), safeHttps(a.cover_url) || safeHttps(c.coverUrl));
}
function showStoreLink(url){
  const target = safeHttps(url);
  const parent = document.getElementById('matchInfo');
  document.getElementById('storeLink')?.remove();
  if(target){
    const link = document.createElement('a'); link.id='storeLink';
    link.className='match-info'; link.href=target; link.target='_blank'; link.rel='noopener noreferrer';
    link.textContent=new URL(target).hostname.includes('deezer') ? 'Bekijk op Deezer ↗' : 'Bekijk in de iTunes Store ↗';
    parent.after(link);
  }
}
function renderTracks(a, tracks, key, cover){
  const trackListEl = document.getElementById('trackList');
  trackListEl.innerHTML = tracks.map((t, i) => {
    const trackUrl = spotifyItem('track', t.spotify_id);
    const storeUrl = safeHttps(t.storeUrl);
    const name = hasPreview(t)
      ? `<button type="button" class="track-link" data-idx="${i}" aria-label="Speel preview: ${esc(t.name)}">${esc(t.name)}</button>`
      : trackUrl ? `<a class="track-link" href="${trackUrl}" target="_blank" rel="noopener">${esc(t.name)}</a>` : `<span class="track-link">${esc(t.name)}</span>`;
    return `<li data-idx="${i}">
      <span class="track-num">${i+1}.</span>${name}
      <span class="track-duration">${formatDuration(t.durationMs)}</span>
      ${trackUrl ? playButton(trackUrl, 'Open nummer op Spotify') : ''}
      ${storeUrl ? `<a class="source-link" href="${esc(storeUrl)}" target="_blank" rel="noopener noreferrer">${t.source === 'deezer' ? 'Deezer' : 'iTunes'} ↗</a>` : ''}
    </li>`;
  }).join('');
  playDisplay={a,tracks,key,cover};
  renderPlayerUI(); updateHighlight();
}

function updateAlbumPlay(url){const link=document.querySelector('.album-play');if(link && url)link.href=url;}
function setFavoriteButton(id,active){
  const album=albumsData.find(a=>a.id===id);if(album)album.is_favorite=active;
  if(active)favoriteIds.add(id);else favoriteIds.delete(id);
  const b=document.getElementById('favoriteToggle');
  if(b&&currentAlbum?.id===id){b.textContent=active?'★':'☆';b.setAttribute('aria-pressed',String(active));b.setAttribute('aria-label',active?'Verwijder uit favorieten':'Voeg toe aan favorieten');b.title=active?'Verwijder uit favorieten':'Voeg toe aan favorieten';}
  updateFavoritesFilter();
}
function requestFavoriteLogin(id){pendingFavoriteId=id;const dialog=document.getElementById('favoriteLoginDialog');document.getElementById('favoriteLoginError').textContent='';dialog.showModal();document.getElementById('favoriteEmail').focus();}
async function saveFavorite(id){
  const token=await getFavoriteAccessToken();if(!token){requestFavoriteLogin(id);return;}
  const nextValue=!favoriteIds.has(id);
  try{
    const r=await fetch(DB_URL+'/rest/v1/albums?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:DB_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({is_favorite:nextValue})});
    const rows=await r.json().catch(()=>[]);
    if(!r.ok)throw new Error(rows.message||rows.details||'Opslaan is niet gelukt.');
    if(!Array.isArray(rows)||rows.length!==1)throw new Error('Album niet gevonden of je beheeraccount heeft geen schrijfrechten.');
    setFavoriteButton(id,rows[0].is_favorite===true);
  }catch(e){alert('Favoriet kon niet worden opgeslagen: '+e.message);}
}
function toggleFavorite(){if(currentAlbum)saveFavorite(currentAlbum.id);}
function updateFavoritesFilter(){const active=showFavoritesOnly;favoritesFilter.textContent=active?'★':'☆';favoritesFilter.setAttribute('aria-pressed',String(active));favoritesFilter.setAttribute('aria-label',active?'Toon alle albums':'Toon alleen favorieten');favoritesFilter.title=active?'Toon alle albums':'Toon alleen favorieten';if(dropdownList.classList.contains('open'))renderDropdown(searchInput.value);}
function toggleAlbumView(){
  const shell=albumDisplay.querySelector('.cover-shell');
  const before=shell?.getBoundingClientRect();
  cancelCoverAnimation();
  isAlbumExpanded=!isAlbumExpanded;
  albumDisplay.classList.toggle('expanded',isAlbumExpanded);
  topBar.classList.toggle('album-open',isAlbumExpanded);
  const info=document.getElementById('albumInfo');
  info.inert=!isAlbumExpanded; info.setAttribute('aria-hidden',String(!isAlbumExpanded));
  const button=document.getElementById('coverToggle');
  button.setAttribute('aria-expanded',String(isAlbumExpanded));
  button.setAttribute('aria-label',(isAlbumExpanded?'Nummers verbergen: ':'Nummers tonen: ')+currentAlbum.album);
  const after=shell?.getBoundingClientRect();
  if(before && after && shell.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    coverAnimation=shell.animate([
      {transform:`translate(${before.left-after.left}px,${before.top-after.top}px) scale(${before.width/after.width})`,transformOrigin:'top left'},
      {transform:'none',transformOrigin:'top left'}
    ],{duration:550,easing:'cubic-bezier(.2,.7,.2,1)'});
    coverAnimation.finished?.catch(()=>{});
  }
}
function navigateAlbum(direction){
  if(!currentAlbum || albumsData.length<2)return;
  const index=albumsData.findIndex(a=>a.id===currentAlbum.id);
  const next=(Math.max(index,0)+direction+albumsData.length)%albumsData.length;
  selectAlbum(albumsData[next],direction);
}
let swipeStart=null;
albumDisplay.addEventListener('touchstart',e=>{
  swipeStart=null;
  if(!matchMedia('(max-width:720px)').matches || e.touches.length!==1 || !e.target.closest('.cover-stage'))return;
  const t=e.touches[0];swipeStart={x:t.clientX,y:t.clientY,time:performance.now(),horizontal:false};
},{passive:true});
albumDisplay.addEventListener('touchmove',e=>{
  if(!swipeStart)return;
  if(e.touches.length!==1){swipeStart=null;return;}
  const dx=e.touches[0].clientX-swipeStart.x,dy=e.touches[0].clientY-swipeStart.y;
  if(Math.abs(dy)>20 && Math.abs(dy)>Math.abs(dx)){swipeStart=null;return;}
  if(Math.abs(dx)>15 && Math.abs(dx)>Math.abs(dy)*1.4){swipeStart.horizontal=true;if(e.cancelable)e.preventDefault();}
},{passive:false});
albumDisplay.addEventListener('touchend',e=>{
  const start=swipeStart;swipeStart=null;
  if(!start || !e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;
  if(start.horizontal)suppressCoverClickUntil=performance.now()+450;
  if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)*1.4 || performance.now()-start.time>1000)return;
  suppressCoverClickUntil=performance.now()+450;
  navigateAlbum(dx<0?1:-1);
},{passive:true});
albumDisplay.addEventListener('touchcancel',()=>{swipeStart=null;},{passive:true});
albumDisplay.addEventListener('keydown',e=>{
  if(!e.target.closest('.cover-stage'))return;
  if(e.key==='ArrowLeft' || e.key==='ArrowRight'){e.preventDefault();navigateAlbum(e.key==='ArrowLeft'?-1:1);document.getElementById('coverToggle')?.focus();}
});

// dropdown interactie
searchInput.addEventListener('focus', () => renderDropdown(searchInput.value));
searchInput.addEventListener('input', () => renderDropdown(searchInput.value));
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')){
    dropdownList.classList.remove('open');
  }
});
searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') dropdownList.classList.remove('open');
});

favoritesFilter.addEventListener('click',()=>{showFavoritesOnly=!showFavoritesOnly;updateFavoritesFilter();});
document.getElementById('favoriteLoginCancel').addEventListener('click',()=>{pendingFavoriteId=null;document.getElementById('favoriteLoginDialog').close();});
document.getElementById('favoriteLoginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const submit=document.getElementById('favoriteLoginSubmit'),error=document.getElementById('favoriteLoginError');
  submit.disabled=true;error.textContent='';
  try{
    const s=await authRequest('/auth/v1/token?grant_type=password',{email:document.getElementById('favoriteEmail').value.trim(),password:document.getElementById('favoritePassword').value});
    if(s.user?.id!==OWNER_ID)throw new Error('Dit account heeft geen beheerrechten.');
    saveFavoriteSession({...s,expires_at:s.expires_at||Math.floor(Date.now()/1000)+s.expires_in});
    document.getElementById('favoritePassword').value='';
    document.getElementById('favoriteLoginDialog').close();
    const id=pendingFavoriteId;pendingFavoriteId=null;if(id)await saveFavorite(id);
  }catch(err){error.textContent=err.message||'Inloggen is niet gelukt.';}
  finally{submit.disabled=false;}
});

// "Random" knop: kiest een willekeurig album uit de volledige lijst
randomBtn.addEventListener('click', () => {
  if(!albumsData.length) return;
  const pool=showFavoritesOnly?albumsData.filter(a=>favoriteIds.has(a.id)):albumsData;
  if(!pool.length)return;
  const randomIndex = Math.floor(Math.random() * pool.length);
  selectAlbum(pool[randomIndex]);
});

// Spotify-app toggle: voorkeur opslaan + huidige album herrenderen met nieuwe links
appModeToggle.addEventListener('change', () => {
  setLinkMode(appModeToggle.checked ? 'app' : 'web');
  if(currentAlbum){
    renderAlbum(currentAlbum);
  }
});

updateFavoritesFilter();

// Toggle-status initialiseren vanuit opgeslagen voorkeur
appModeToggle.checked = (getLinkMode() === 'app');

// Zoekbalk start in de homepage-slot (gecentreerd, onder de titel)
homeSearchRow.appendChild(searchRowEl);

loadCollection();
// Start met lege zoekbox, homepage zichtbaar en gecentreerd, geen album getoond
